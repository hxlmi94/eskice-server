<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hedefler — Eskice</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a6435">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{--bronz:#8a6435;--bronz2:#6e5323;--yazi:#5f4623;--muted:#8a7a5f;--krem:#fbf5e9;--line:#d8c39c;--yesil:#5b7048;--mor:#7a5c8a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'EB Garamond',serif;color:var(--yazi);min-height:100vh;display:flex;justify-content:center;background:#e7d4ab url('https://hxlmi94.github.io/eskice-server/sohbet.png') center/cover fixed no-repeat}
  body::before{content:"";position:fixed;inset:0;background:rgba(242,233,210,.62);z-index:0}
  .ekran{position:relative;z-index:1;width:100%;max-width:480px;min-height:100vh;padding:20px 22px 40px;background:rgba(247,240,224,.35);border-left:1px solid rgba(138,100,53,.18);border-right:1px solid rgba(138,100,53,.18)}
  .ust{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .geri{text-decoration:none;color:var(--bronz);font-size:28px;line-height:1}
  .baslik{font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--yazi);letter-spacing:1px}
  .ay{font-size:14px;color:var(--muted);font-style:italic;margin-bottom:18px;margin-left:40px}
  .kart{background:rgba(251,245,233,.85);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .kbas{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .kbas .ad{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--yazi)}
  .kbas .oran{font-size:14px;color:var(--muted)}
  .bar{height:14px;background:#e7dcc4;border-radius:20px;overflow:hidden;margin-bottom:8px}
  .dolu{height:100%;border-radius:20px;transition:width .6s;background:linear-gradient(90deg,#b98f4e,#8a6435)}
  .dolu.kar{background:linear-gradient(90deg,#7ba05b,#5b7048)}
  .dolu.uretim{background:linear-gradient(90deg,#9a7bb0,#7a5c8a)}
  .durum{font-size:14px;color:var(--bronz2)}
  .tamam{color:var(--yesil);font-weight:600}
  .ayar{display:flex;gap:8px;align-items:center;margin-top:10px}
  .ayar input{flex:1;background:#fffdf7;border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--yazi);font-family:'EB Garamond',serif;font-size:15px}
  .ayar button{background:rgba(138,100,53,.12);color:var(--bronz2);border:1px solid var(--line);border-radius:9px;padding:9px 14px;font-family:'EB Garamond',serif;font-size:14px;cursor:pointer}
  .not{text-align:center;font-size:13px;color:var(--muted);font-style:italic;margin-top:20px;line-height:1.5}
  .yukleniyor{text-align:center;color:var(--muted);padding:30px;font-style:italic}
</style>
</head>
<body>
  <div class="ekran">
    <div class="ust">
      <a class="geri" href="menu.html">‹</a>
      <div class="baslik">Hedefler</div>
    </div>
    <div class="ay" id="ay"></div>
    <div id="govde"><div class="yukleniyor">Yükleniyor...</div></div>
    <div class="not">Hedeflerin bu telefonda saklanır. Her ay başında ilerleme sıfırdan sayılır.</div>
  </div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase = createClient(
  'https://mepfyrnmscrqbzxlbjyf.supabase.co',
  'sb_publishable_QE5BnaX_nvb36agQ0t0GNw_wkASsY06'
);
const AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const fmt=(n)=>(Number(n)||0).toLocaleString('tr-TR');
const now=new Date();
document.getElementById('ay').textContent = AYLAR[now.getMonth()]+' '+now.getFullYear()+' hedeflerin';

function buAyMi(t){ if(!t) return false; const d=new Date(t); if(isNaN(d)) return false; return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear(); }
function hedefAl(){ try{ return JSON.parse(localStorage.getItem('eskice_hedef')||'{}'); }catch(e){ return {}; } }
function hedefYaz(h){ localStorage.setItem('eskice_hedef', JSON.stringify(h)); }
const para=(s)=>{ const n=parseFloat(String(s||'').replace(/[^\d.,-]/g,'').replace(',','.')); return isNaN(n)?0:n; };

async function hesapla(){
  // muhasebe: bu ayın kârı + satış sayısı
  const [as, gd, at] = await Promise.all([
    supabase.from('alim_satim').select('*'),
    supabase.from('giderler').select('*'),
    supabase.from('atolye').select('*')
  ]);
  const islemler=as.data||[], giderler=gd.data||[], atolye=at.data||[];
  let satim=0,alim=0,gider=0,satisSayisi=0;
  islemler.forEach(k=>{ const t=para(k.fiyat); if(buAyMi(k.created_at)){ if((k.tur||'').includes('sat')){satim+=t;satisSayisi++;} else alim+=t; } });
  giderler.forEach(k=>{ if(buAyMi(k.created_at)) gider+=para(k.tutar); });
  // atölye satışlarından da kâr
  let atolyeKar=0, uretim=0;
  atolye.forEach(a=>{ if(buAyMi(a.created_at)) uretim++; if((a.durum||'')==='satildi'&&a.satis_fiyati&&buAyMi(a.created_at)) atolyeKar+=(Number(a.satis_fiyati)||0)-(Number(a.malzeme_maliyeti)||0); });
  const kar = (satim-alim-gider)+atolyeKar;
  return { kar, satisSayisi, uretim };
}

function ciz(guncel){
  const h=hedefAl();
  const kartlar=[
    {anahtar:'kar', ad:'Aylık Kâr', birim:'TL', deger:guncel.kar, renk:'kar', ph:'örn: 5000'},
    {anahtar:'satis', ad:'Satış Sayısı', birim:'adet', deger:guncel.satisSayisi, renk:'', ph:'örn: 10'},
    {anahtar:'uretim', ad:'Üretim (Atölye)', birim:'iş', deger:guncel.uretim, renk:'uretim', ph:'örn: 4'}
  ];
  document.getElementById('govde').innerHTML = kartlar.map(k=>{
    const hedef=Number(h[k.anahtar])||0;
    const oran=hedef>0?Math.min(100,Math.round((k.deger/hedef)*100)):0;
    const tamamMi=hedef>0&&k.deger>=hedef;
    let durumYazi;
    if(hedef<=0) durumYazi='<span class="durum">Henüz hedef koymadın.</span>';
    else if(tamamMi) durumYazi='<span class="tamam">🎉 Hedefe ulaştın! ('+fmt(k.deger)+' / '+fmt(hedef)+' '+k.birim+')</span>';
    else durumYazi='<span class="durum">'+fmt(k.deger)+' / '+fmt(hedef)+' '+k.birim+' — kalan '+fmt(hedef-k.deger)+'</span>';
    return '<div class="kart"><div class="kbas"><span class="ad">'+k.ad+'</span><span class="oran">'+(hedef>0?oran+'%':'')+'</span></div>'+
      '<div class="bar"><div class="dolu '+k.renk+'" style="width:'+oran+'%"></div></div>'+
      durumYazi+
      '<div class="ayar"><input type="number" id="h_'+k.anahtar+'" placeholder="'+k.ph+'" value="'+(hedef>0?hedef:'')+'">'+
      '<button data-k="'+k.anahtar+'">Kaydet</button></div></div>';
  }).join('');
  document.querySelectorAll('.ayar button').forEach(b=>{
    b.onclick=()=>{ const h=hedefAl(); h[b.dataset.k]=Number(document.getElementById('h_'+b.dataset.k).value)||0; hedefYaz(h); baslat(); };
  });
}

async function baslat(){
  try{ const g=await hesapla(); ciz(g); }
  catch(e){ document.getElementById('govde').innerHTML='<div class="yukleniyor">Okunamadı, tekrar dene.</div>'; }
}
baslat();
</script>
</body>
</html>
