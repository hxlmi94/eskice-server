<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eskice</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{--bronz:#8a6435;--bronz2:#6e5323;--altin:#b98f4e;--yazi:#5f4623;--krem:#fbf5e9;--line:#d8c39c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'EB Garamond',serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
    background:#e7d4ab url('https://hxlmi94.github.io/eskice-server/sohbet.png') center/cover fixed no-repeat;
  }
  body::before{content:"";position:fixed;inset:0;background:rgba(241,231,206,.6);z-index:0}
  .ekran{position:relative;z-index:1;width:100%;max-width:480px;min-height:100vh;padding:44px 26px 40px;
    background:rgba(247,240,224,.32);border-left:1px solid rgba(138,100,53,.18);border-right:1px solid rgba(138,100,53,.18)}

  /* Cep saati logosu */
  .amblem{display:flex;justify-content:center;margin-bottom:6px;animation:bel .8s ease both}
  .amblem svg{width:54px;height:54px}

  .ad{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:48px;color:var(--yazi);letter-spacing:6px;text-align:center;line-height:1;animation:bel .8s .05s ease both}
  .alt{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:var(--bronz);text-align:center;margin-top:4px;animation:bel .8s .1s ease both}

  /* yaldız süs çizgisi */
  .susleme{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 10px;color:var(--altin);animation:bel .8s .15s ease both}
  .susleme .cizgi{height:1px;width:60px;background:linear-gradient(90deg,transparent,var(--altin))}
  .susleme .cizgi.sag{background:linear-gradient(90deg,var(--altin),transparent)}
  .susleme svg{width:16px;height:16px}

  .selam{text-align:center;font-size:16.5px;color:#6e5836;font-style:italic;margin:6px 0 26px;animation:bel .8s .2s ease both}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .kart{background:rgba(251,245,233,.82);border:1px solid var(--line);border-radius:16px;padding:22px 12px 20px;
    display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;text-decoration:none;
    box-shadow:0 1px 3px rgba(90,70,40,.1);transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
    opacity:0;animation:yuksel .6s ease forwards}
  .kart:hover{transform:translateY(-3px);background:rgba(253,248,238,.95);box-shadow:0 8px 20px rgba(110,83,35,.18)}
  .kart svg{width:34px;height:34px;color:var(--bronz)}
  .kart .et{font-family:'EB Garamond',serif;font-size:16px;color:var(--yazi);font-weight:500;letter-spacing:.3px}

  .sohbet{grid-column:1 / -1;background:linear-gradient(160deg,#9a7238,#6e5323);border:none;padding:24px 12px}
  .sohbet svg{width:40px;height:40px;color:var(--krem)}
  .sohbet .et{color:var(--krem);font-size:19px;letter-spacing:1px}

  .kart:nth-child(1){animation-delay:.25s}
  .kart:nth-child(2){animation-delay:.33s}
  .kart:nth-child(3){animation-delay:.4s}
  .kart:nth-child(4){animation-delay:.47s}
  .kart:nth-child(5){animation-delay:.54s}

  @keyframes bel{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @keyframes yuksel{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
</head>
