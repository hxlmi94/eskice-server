<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eskice</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a6435">
<link rel="apple-touch-icon" href="ikon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Jost',sans-serif;
    background:#2b2118 url('giris.jpg') center/cover no-repeat;
    height:100vh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
    position:relative;text-align:center;
  }
  .perde{position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,30,18,0) 45%,rgba(40,28,15,.55) 100%);}
  .icerik{position:relative;z-index:2;padding:0 26px 64px;}
  .logo{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:64px;letter-spacing:6px;color:#f6ecd8;text-shadow:0 2px 20px rgba(30,20,10,.5);line-height:1;}
  .alt{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;color:#f0e4cd;margin-top:8px;text-shadow:0 1px 10px rgba(30,20,10,.5);letter-spacing:1px;}
  .basla{display:inline-block;margin-top:34px;font-family:'Jost',sans-serif;font-size:16px;letter-spacing:2px;color:#3a2c1a;background:linear-gradient(180deg,#e9d8b0,#c9a86f);border:none;border-radius:30px;padding:14px 46px;cursor:pointer;text-decoration:none;box-shadow:0 4px 18px rgba(30,20,10,.35);transition:filter .15s;}
  .basla:hover{filter:brightness(1.06)}
</style>
</head>
<body>
  <div class="perde"></div>
  <div class="icerik">
    <div class="logo">Eskice</div>
    <div class="alt">antika yoldaşın</div>
    <a class="basla" href="menu.html">Başla</a>
  </div>
</body>
</html>
