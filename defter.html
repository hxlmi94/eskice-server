<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhasebe — Eskice</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{--bronz:#8a6435;--bronz2:#6e5323;--yazi:#5f4623;--muted:#8a7a5f;--krem:#fbf5e9;--line:#d8c39c;--yesil:#5b7048;--kirmizi:#9b4a38}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'EB Garamond',serif;color:var(--yazi);min-height:100vh;display:flex;justify-content:center;background:#e7d4ab url('https://hxlmi94.github.io/eskice-server/sohbet.png') center/cover fixed no-repeat}
  body::before{content:"";position:fixed;inset:0;background:rgba(242,233,210,.62);z-index:0}
  .ekran{position:relative;z-index:1;width:100%;max-width:480px;min-height:100vh;padding:20px 22px 40px;background:rgba(247,240,224,.35);border-left:1px solid rgba(138,100,53,.18);border-right:1px solid rgba(138,100,53,.18)}
  .ust{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .geri{text-decoration:none;color:var(--bronz);font-size:28px;line-height:1}
  .baslik{font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--yazi);letter-spacing:1px}
  .ayrapor{background:linear-gradient(160deg,#9a7238,#6e5323);border-radius:16px;padding:18px 20px;margin-bottom:16px;color:var(--krem)}
  .ayrapor .aybaslik{font-family:'Cormorant Garamond',serif;font-size:19px;letter-spacing:.5px;margin-bottom:12px;opacity:.95}
  .ayrapor .net{font-family:'Cormorant Garamond',serif;font-size:32px;margin:2px 0 12px}
  .ayrapor .netetiket{font-size:12px;opacity:.8;letter-spacing:1px}
  .ayrapor .satir{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-top:1px solid rgba(255,255,255,.15)}
  .bolum{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--bronz2);margin:18px 0 10px}
  .ikili{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:6px}
  .kutu{background:rgba(251,245,233,.85);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
  .kutu .rakam{font-family:'Cormorant Garamond',serif;font-size:17px}
  .kutu.gelir .rakam{color:var(--yesil)}
  .kutu.gider .rakam{color:var(--kirmizi)}
  .kutu .etiket{font-size:11px;color:var(--muted);margin-top:2px}
  .liste{display:flex;flex-direction:column;gap:9px}
  .satirk{background:rgba(251,245,233,.82);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center}
  .satirk .ad{font-size:15px;font-weight:500}
  .satirk .tarih{font-size:12px;color:var(--muted);font-style:italic;margin-top:2px}
  .rozet{font-size:11px;padding:2px 8px;border-radius:20px;margin-left:6px}
  .rozet.alis{background:#efe6d4;color:var(--bronz2)}
  .rozet.satis{background:#e6efe0;color:var(--yesil)}
  .rozet.gider{background:#f2e0da;color:var(--kirmizi)}
  .fiyat{font-family:'Cormorant Garamond',serif;font-size:16px;white-space:nowrap}
  .bos{text-align:center;color:var(--muted);font-style:italic;padding:34px 16px;border:1px dashed var(--line);border-radius:14px}
  .yukleniyor{text-align:center;color:var(--muted);padding:40px;font-style:italic}
</style>
</head>
<body>
  <div class="ekran">
    <div class="ust">
      <a class="geri" href="menu.html">‹</a>
      <div class="baslik">Muhasebe</div>
    </div>
    <div class="ayrapor" id="ayrapor" style="display:none">
      <div class="aybaslik" id="aybaslik">Bu Ay</div>
      <div class="netetiket">BU AY NET KÂR</div>
      <div class="net" id="ayNet">—</div>
      <div class="satir"><span>Satış geliri</span><span id="aySatis">—</span></div>
      <div class="satir"><span>Alımlar</span><span id="ayAlim">—</span></div>
      <div class="satir"><span>Giderler</span><span id="ayGider">—</span></div>
    </div>
    <div class="bolum">Genel Toplam</div>
    <div class="ikili">
      <div class="kutu gelir"><div class="rakam" id="gelir">—</div><div class="etiket">Satış</div></div>
      <div class="kutu gider"><div class="rakam" id="gider">—</div><div class="etiket">Gider+Alım</div></div>
      <div class="kutu"><div class="rakam" id="net">—</div><div class="etiket">Net Kâr</div></div>
    </div>
    <div class="bolum">Hareketler</div>
    <div class="liste" id="liste"><div class="yukleniyor">Yükleniyor...</div></div>
  </div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase = createClient(
  'https://SENIN-PROJEN.supabase.co',
  'SENIN-PUBLISHABLE-ANAHTARIN'
);

const para = (s)=>{ const n=parseFloat(String(s||'').replace(/[^\d.,-]/g,'').replace(',','.')); return isNaN(n)?0:n; };
const fmt = (n)=> n.toLocaleString('tr-TR') + ' TL';
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function buAyMi(t){ if(!t) return false; const d=new Date(t); if(isNaN(d)) return false; const n=new Date(); return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear(); }

async function yukle(){
  const liste = document.getElementById('liste');
  try{
    const [as, gd] = await Promise.all([
      supabase.from('alim_satim').select('*').order('created_at',{ascending:false}),
      supabase.from('giderler').select('*').order('created_at',{ascending:false})
    ]);
    const islemler = as.data || [];
    const giderler = gd.data || [];
    let alim=0,satim=0,gider=0,aAlim=0,aSatim=0,aGider=0;
    islemler.forEach(k=>{ const t=para(k.fiyat),bu=buAyMi(k.created_at); if((k.tur||'').includes('sat')){satim+=t; if(bu)aSatim+=t;} else {alim+=t; if(bu)aAlim+=t;} });
    giderler.forEach(k=>{ const t=para(k.tutar),bu=buAyMi(k.created_at); gider+=t; if(bu)aGider+=t; });
    document.getElementById('gelir').textContent=fmt(satim);
    document.getElementById('gider').textContent=fmt(alim+gider);
    document.getElementById('net').textContent=fmt(satim-alim-gider);
    const now=new Date();
    document.getElementById('aybaslik').textContent=AYLAR[now.getMonth()]+' '+now.getFullYear();
    document.getElementById('ayNet').textContent=fmt(aSatim-aAlim-aGider);
    document.getElementById('aySatis').textContent=fmt(aSatim);
    document.getElementById('ayAlim').textContent=fmt(aAlim);
    document.getElementById('ayGider').textContent=fmt(aGider);
    document.getElementById('ayrapor').style.display='block';
    const hepsi=[];
    islemler.forEach(k=> hepsi.push({tip:(k.tur||'').includes('sat')?'satis':'alis',ad:k.ad,tutar:k.fiyat,tarih:k.tarih,t:k.created_at}));
    giderler.forEach(k=> hepsi.push({tip:'gider',ad:k.aciklama,tutar:k.tutar,tarih:k.tarih,t:k.created_at}));
    hepsi.sort((a,b)=> new Date(b.t||0)-new Date(a.t||0));
    if(!hepsi.length){ liste.innerHTML='<div class="bos">Henüz hareket yok. Eskice ile konuşurken alım, satım ya da masraf söyle.</div>'; return; }
    const ad={alis:'alış',satis:'satış',gider:'gider'};
    liste.innerHTML=hepsi.map(k=>'<div class="satirk"><div><div class="ad">'+(k.ad||'-')+'<span class="rozet '+k.tip+'">'+ad[k.tip]+'</span></div><div class="tarih">'+(k.tarih||'')+'</div></div><div class="fiyat">'+(k.tutar||'')+'</div></div>').join('');
  }catch(err){ liste.innerHTML='<div class="bos">Okunamadı: '+err.message+'</div>'; }
}
yukle();
</script>
</body>
</html>
