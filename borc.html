<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borç & Alacak — Eskice</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a6435">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{--bronz:#8a6435;--bronz2:#6e5323;--yazi:#5f4623;--muted:#8a7a5f;--krem:#fbf5e9;--line:#d8c39c;--yesil:#5b7048;--kirmizi:#9b4a38}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'EB Garamond',serif;color:var(--yazi);min-height:100vh;display:flex;justify-content:center;background:#e7d4ab url('https://hxlmi94.github.io/eskice-server/sohbet.png') center/cover fixed no-repeat}
  body::before{content:"";position:fixed;inset:0;background:rgba(242,233,210,.62);z-index:0}
  .ekran{position:relative;z-index:1;width:100%;max-width:480px;min-height:100vh;padding:20px 22px 40px;background:rgba(247,240,224,.35);border-left:1px solid rgba(138,100,53,.18);border-right:1px solid rgba(138,100,53,.18)}
  .ust{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .geri{text-decoration:none;color:var(--bronz);font-size:28px;line-height:1}
  .baslik{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--yazi);letter-spacing:1px}
  .ozet{display:flex;gap:10px;margin-bottom:16px}
  .ozet .kutu{flex:1;border-radius:14px;padding:14px;text-align:center;color:#fff}
  .ozet .alacak{background:linear-gradient(160deg,#7ba05b,#5b7048)}
  .ozet .borc{background:linear-gradient(160deg,#b06a53,#8a3f2f)}
  .ozet .rakam{font-family:'Cormorant Garamond',serif;font-size:22px}
  .ozet .et{font-size:12px;opacity:.9;margin-top:2px}
  .ekle{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:linear-gradient(160deg,#9a7238,#6e5323);color:var(--krem);border:none;border-radius:14px;padding:13px;font-family:'EB Garamond',serif;font-size:16px;cursor:pointer;margin-bottom:18px}
  .liste{display:flex;flex-direction:column;gap:10px}
  .kart{background:rgba(251,245,233,.85);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;border-left:3px solid var(--yesil)}
  .kart.borc{border-left-color:var(--kirmizi)}
  .kart.odendi{opacity:.55}
  .kartic{flex:1}
  .kart .kisi{font-family:'Cormorant Garamond',serif;font-size:18px}
  .kart .acik{font-size:13px;color:var(--muted);font-style:italic}
  .kart .tutar{font-family:'Cormorant Garamond',serif;font-size:18px;white-space:nowrap}
  .kart.alacak .tutar{color:var(--yesil)}
  .kart.borc .tutar{color:var(--kirmizi)}
  .islem{display:flex;flex-direction:column;gap:4px}
  .islem button{background:none;border:none;cursor:pointer;font-size:16px;padding:2px}
  .bos{text-align:center;color:var(--muted);font-style:italic;padding:34px 16px;border:1px dashed var(--line);border-radius:14px}
  .yukleniyor{text-align:center;color:var(--muted);padding:34px;font-style:italic}
  /* pencere */
  .perde{position:fixed;inset:0;background:rgba(50,35,15,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
  .pencere{background:#f7f0e0;border-radius:18px;padding:22px;width:100%;max-width:380px;border:1px solid var(--line)}
  .pencere h3{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--yazi);margin-bottom:14px;text-align:center}
  .secim{display:flex;gap:8px;margin-bottom:12px}
  .secim button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fffdf7;color:var(--muted);font-family:'EB Garamond',serif;font-size:15px;cursor:pointer}
  .secim button.aktif.alacak{background:var(--yesil);color:#fff;border-color:var(--yesil)}
  .secim button.aktif.borc{background:var(--kirmizi);color:#fff;border-color:var(--kirmizi)}
  .pencere input{width:100%;background:#fffdf7;border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--yazi);font-family:'EB Garamond',serif;font-size:16px;margin-bottom:12px}
  .pbtn{width:100%;border:none;border-radius:11px;padding:13px;font-family:'EB Garamond',serif;font-size:16px;cursor:pointer;margin-bottom:8px}
  .pbtn.kaydet{background:linear-gradient(180deg,#a97c46,#8a6435);color:var(--krem)}
  .pbtn.kapat{background:none;color:var(--muted)}
  .durumyazi{text-align:center;color:var(--bronz2);font-style:italic;font-size:14px;min-height:18px;margin-bottom:6px}
</style>
</head>
<body>
  <div class="ekran">
    <div class="ust">
      <a class="geri" href="menu.html">‹</a>
      <div class="baslik">Borç & Alacak</div>
    </div>

    <div class="ozet">
      <div class="kutu alacak"><div class="rakam" id="oAlacak">—</div><div class="et">Alacağın (sana borçlu)</div></div>
      <div class="kutu borc"><div class="rakam" id="oBorc">—</div><div class="et">Borcun (sen borçlu)</div></div>
    </div>

    <button class="ekle" id="ekleBtn">+
